name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Build Archive (Unsigned)
      run: |
        xcodebuild archive \
          -project WlanOptimizerIOS/WlanOptimizerIOS.xcodeproj \
          -scheme WlanOptimizerIOS \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath WlanOptimizerIOS/build/WlanOptimizerIOS.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r WlanOptimizerIOS/build/WlanOptimizerIOS.xcarchive/Products/Applications/WlanOptimizerIOS.app Payload/
        zip -r WlanOptimizerIOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WlanOptimizerIOS-IPA
        path: WlanOptimizerIOS.ipa
