name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build App (Unsigned)
      run: |
        cd WlanOptimizerIOS
        xcodebuild clean build \
          -project WlanOptimizerIOS.xcodeproj \
          -scheme WlanOptimizerIOS \
          -configuration Release \
          -arch arm64 -sdk iphoneos \
          CODE_SIGN_STYLE="Manual" \
          CODE_SIGNING_ALLOWED="NO" \
          CODE_SIGNING_REQUIRED="NO" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ENTITLEMENTS_REQUIRED="NO" \
          CONFIGURATION_BUILD_DIR=$(pwd)/build > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

    - name: Commit Error Log on Failure
      if: failure()
      run: |
        grep -i "error:" WlanOptimizerIOS/build_log.txt > error_log.txt || true
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add error_log.txt
        git commit -m "Upload error log"
        git push

    - name: Package IPA
      run: |
        cd WlanOptimizerIOS
        mkdir -p Payload
        cp -r build/WlanOptimizerIOS.app Payload/
        zip -r WlanOptimizerIOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WlanOptimizerIOS-IPA
        path: WlanOptimizerIOS/WlanOptimizerIOS.ipa
