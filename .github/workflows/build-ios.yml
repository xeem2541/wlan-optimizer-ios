name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build Archive (Unsigned)
      run: |
        cd WlanOptimizerIOS
        xcodebuild archive \
          -project WlanOptimizerIOS.xcodeproj \
          -scheme WlanOptimizerIOS \
          -configuration Release \
          -archivePath build/WlanOptimizerIOS.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA
      run: |
        cd WlanOptimizerIOS
        mkdir -p Payload
        cp -r build/WlanOptimizerIOS.xcarchive/Products/Applications/WlanOptimizerIOS.app Payload/
        zip -r WlanOptimizerIOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WlanOptimizerIOS-IPA
        path: WlanOptimizerIOS/WlanOptimizerIOS.ipa
