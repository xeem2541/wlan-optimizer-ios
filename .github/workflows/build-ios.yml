name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Build App (Unsigned)
      run: |
        cd WlanOptimizerIOS
        xcodebuild clean build \
          -project WlanOptimizerIOS.xcodeproj \
          -scheme WlanOptimizerIOS \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ENTITLEMENTS_REQUIRED=NO \
          CONFIGURATION_BUILD_DIR=$(pwd)/build

    - name: Package IPA
      run: |
        cd WlanOptimizerIOS
        mkdir -p Payload
        cp -r build/WlanOptimizerIOS.app Payload/
        zip -r WlanOptimizerIOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WlanOptimizerIOS-IPA
        path: WlanOptimizerIOS/WlanOptimizerIOS.ipa
